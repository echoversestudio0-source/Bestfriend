
name: Build BestFriend APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir source
          unzip -q BestFriend-AndroidProject.zip -d source

      - name: Locate Project
        run: |
          PROJECT=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BestFriend-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
