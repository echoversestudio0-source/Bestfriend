
name: Build BestFriend APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project
        run: |
          mkdir -p source
          unzip -q -o BestFriend-AndroidProject.zip -d source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android Project
        run: |
          PROJECT=$(find source -name settings.gradle.kts -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android project settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BestFriend-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
